name: Cache photos

# Copies the Wikimedia Commons photos the site shows into photos/,
# so the pages load fast and do not depend on another server.
on:
  push:
    branches: [main]
    paths: [photos/manifest.json, tools/cache_photos.py, .github/workflows/photos.yml]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: cache-photos
  cancel-in-progress: false

jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow
      - run: python tools/cache_photos.py
      - name: Commit new photos
        run: |
          git config user.name "donetsk2011-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photos
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "photos: cache Wikimedia Commons copies"
          git pull --rebase --quiet origin main
          git push
      - name: Rebuild GitHub Pages
        if: always()
        run: |
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
